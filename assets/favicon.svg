<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.85"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle with Subtle Neon Border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>
  
  <!-- Stylized Cybernetic "S" -->
  <path d="M45 20 C43 14.5, 38.5 13.5, 32 13.5 C23 13.5, 17.5 18, 17.5 24.5 C17.5 32, 25 34.5, 32 37 C39 39.5, 46.5 42, 46.5 49.5 C46.5 56, 41 60.5, 32 60.5 C24.5 60.5, 19 59.5, 17 54" 
        fill="none" stroke="url(#sGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        
  <!-- Glowing Satellite Core Accents -->
  <circle cx="45" cy="20" r="2.2" fill="#ffffff"/>
  <circle cx="17" cy="54" r="2.2" fill="#38bdf8"/>
</svg>